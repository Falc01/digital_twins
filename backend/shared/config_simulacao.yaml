# backend/shared/config_simulacao.yaml
# Parâmetros de calibração para a suíte de simulação de pedestres do Pelourinho

simulation:
  temporal:
    peak_hour_default: 16.5       # t_pico = 16h30
    spread_hours_default: 3.0     # σ = 3.0 horas
    fundamental_period: 24.0      # T_ciclo = 24h
    step_minutes: 5.0             # Intervalo Δt do tick de simulação

  macro_flow:
    default_N_max: 300            # Lotação máxima global basal do Pelourinho
    default_N_min: 15             # Piso basal da madrugada (03h00)
    default_gamma: 1.0            # Fator sazonal padrão (dias úteis normais)
    default_gate_weights:         # Pesos de entrada padrão para 4 portões principais
      - 0.45                      # Sensor Elevador Lacerda
      - 0.35                      # Sensor Praça da Sé
      - 0.20                      # Sensor Ladeira do Carmo
      - 0.00                      # Sensor Largo interno (sem acesso externo)

  network_markov:
    distance_decay_lambda: 0.015  # λ_d: decaimento de atração por metro (Canal B)
    retention_bias: 1.0           # Viés basal de permanência no mesmo nó (diagonal P_ii)
    default_poi_attraction:       # α_j padrão por categoria de POI
      GATE: 1.0                   # Portões de entrada física
      POI: 1.5                    # Largos turísticos e praças
      IGREJA: 1.8                 # Atratores religiosos/históricos
      SHOW: 2.5                   # Espaços culturais e palcos

  sensor_saturation:
    richards_kappa: 0.08          # κ: declividade da saturação logística de Richards
    inflection_ratio: 0.5         # Fração de N_max para inflexão λ_0 = N_max * 0.5
    zero_anchored: true           # Garante S(0) = 0 sem pedestres fantasmas
    default_noise_method: "ORNSTEIN_UHLENBECK" # Método de ruído instrumental (NONE, UNIFORM, GAUSSIAN, ORNSTEIN_UHLENBECK)
    uniform_R: 3.0                # R: semi-intervalo de variação em pedestres
    gaussian_sigma: 2.5           # σ: desvio padrão do ruído branco gaussiano
    ou_theta: 1.2                 # θ: taxa horária de reversão à média (h^-1)
    ou_sigma: 2.0                 # σ_sensor: volatilidade da difusão instrumental

