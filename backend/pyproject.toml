[project]
name = "digital-twin-iot"
version = "0.1.0"
description = "Gêmeo Digital IoT - UNIFACS: tabelas dinâmicas sem esquema fixo + integração geoespacial de alta performance com QGIS"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Equipe Gêmeo Digital UNIFACS"}
]
keywords = ["digital-twin", "iot", "qgis", "geoespacial", "dyndb", "gpkg"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = []

[project.optional-dependencies]
web = [
  "flask>=3.0.0",
  "pydantic>=2.0",
]
data = [
  "openpyxl>=3.1.0",
]
api = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.29.0",
  "python-multipart>=0.0.9",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
  "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/unifacs/digital-twin"
Documentation = "docs/README.md"
Repository = "https://github.com/unifacs/digital-twin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --tb=short"
